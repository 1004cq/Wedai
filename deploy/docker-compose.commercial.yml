name: ${COMPOSE_PROJECT_NAME:-wedai-commercial}

services:
  app:
    image: ${WEDAI_IMAGE:-wedai:local}
    build:
      context: ..
      dockerfile: Dockerfile
      # Reuse the published main image as a layer cache when it exists; local BuildKit cache still works offline.
      cache_from:
        - ${WEDAI_BUILD_CACHE_FROM:-ghcr.io/1004cq/wedai:main}
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
    ports:
      - '${WEDAI_BIND_ADDRESS:-0.0.0.0}:${LOBE_PORT:-3210}:3210'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    env_file:
      - .env.commercial
    environment:
      DATABASE_DRIVER: node
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgresql:5432/${LOBE_DB_NAME}
      INTERNAL_APP_URL: ${INTERNAL_APP_URL:-http://localhost:3210}
      LLM_VISION_IMAGE_USE_BASE64: '1'
      REDIS_PREFIX: wedai
      REDIS_TLS: '0'
      REDIS_URL: redis://redis:6379
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_BUCKET: ${RUSTFS_LOBE_BUCKET}
      S3_ENABLE_PATH_STYLE: '1'
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      # 1 = public object URLs via S3_PUBLIC_DOMAIN (needs nginx proxy to RustFS).
      # 0 = presigned URLs signed against S3_ENDPOINT (must be browser-reachable).
      S3_SET_ACL: ${S3_SET_ACL:-1}
      SEARXNG_URL: ${SEARXNG_URL:-}
    restart: unless-stopped
    networks:
      - wedai

  postgresql:
    image: ${WEDAI_POSTGRES_IMAGE:-paradedb/paradedb:0.24.3-pg17}
    command: ['postgres', '-c', 'shared_preload_libraries=pg_search']
    environment:
      POSTGRES_DB: ${LOBE_DB_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - wedai

  redis:
    image: ${WEDAI_REDIS_IMAGE:-redis:7.4.10-alpine3.21}
    command: ['redis-server', '--save', '60', '1000', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - wedai

  rustfs:
    image: ${WEDAI_RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-beta.10}
    command: ['--access-key', '${RUSTFS_ACCESS_KEY}', '--secret-key', '${RUSTFS_SECRET_KEY}', '/data']
    ports:
      - '${RUSTFS_BIND_ADDRESS:-0.0.0.0}:${RUSTFS_PORT:-9000}:9000'
      - '${RUSTFS_ADMIN_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_ADMIN_PORT:-9001}:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - wedai

  rustfs-init:
    image: ${WEDAI_RUSTFS_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_LOBE_BUCKET: ${RUSTFS_LOBE_BUCKET}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - ../docker-compose/deploy/bucket.config.json:/bucket.config.json:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY" >/dev/null
        mc mb "rustfs/$$RUSTFS_LOBE_BUCKET" --ignore-existing >/dev/null
        # mc image has no sed — write anonymous GetObject policy for the real bucket name.
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$RUSTFS_LOBE_BUCKET" > /tmp/bucket.config.json
        mc anonymous set-json /tmp/bucket.config.json "rustfs/$$RUSTFS_LOBE_BUCKET" >/dev/null
    restart: 'no'
    networks:
      - wedai

  searxng:
    # Optional in the fast core profile; full preserves the original search stack.
    profiles: ['full']
    image: ${WEDAI_SEARXNG_IMAGE:-searxng/searxng:2026.7.28-c01178d03}
    environment:
      SEARXNG_SETTINGS_FILE: /etc/searxng/settings.yml
    volumes:
      - ../docker-compose/deploy/searxng-settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    networks:
      - wedai

networks:
  wedai:
    driver: bridge

volumes:
  postgres-data: {}
  redis-data: {}
  rustfs-data: {}
